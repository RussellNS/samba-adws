[pytest]
testpaths = tests
python_files = test_*.py

# Stubbed by default (runs anywhere); `pytest -m live` uses real
# python3-samba and must be run inside the samba-ad-dc container.
# See tests/conftest.py for how the two modes are selected.
addopts = -ra --strict-markers

markers =
    live: requires real python3-samba (and for some tests a running AD DC)
